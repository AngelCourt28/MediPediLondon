<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Medi Pedi London</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Hamburger button -->
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle navigation" aria-expanded="false">
        ☰
    </button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <nav>
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>

    <!-- Main content -->
    <div class="main-content">

        <main>

            <header>
                <h1>Book Your Appointment</h1>
            </header>

            <section class="contact-section">

                <p class="contact-intro">
                    Don't wait for your experience. Book your personalised treatment now.
                </p>

                <a href="tel:+447904517522" id="bookButton">Call Us</a>

                <div class="map-container">
                    <iframe src="https://www.google.com/maps?q=15+Currey+Rd,+Greenford+UB6+0BD&output=embed"
                        width="100%" height="350" style="border:0;" allowfullscreen loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>

            </section>

        </main>

    </div>

    <script>
        function toggleMenu() {
            const sidebar = document.getElementById("sidebar");
            const button = document.querySelector(".menu-toggle");

            sidebar.classList.toggle("open");

            button.setAttribute(
                "aria-expanded",
                sidebar.classList.contains("open")
            );
        }
    </script>

</body>

</html>
